# Kafka Connect distributed worker for the demo.
bootstrap.servers=kafka:9092
group.id=feast-connect-cluster

# Default converters: JSON values without schemas, string keys.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Internal topics (single-broker demo -> replication factor 1).
offset.storage.topic=connect-offsets
offset.storage.replication.factor=1
offset.storage.partitions=25
config.storage.topic=connect-configs
config.storage.replication.factor=1
status.storage.topic=connect-status
status.storage.replication.factor=1
status.storage.partitions=5

offset.flush.interval.ms=10000

# Sink tasks read the topic from the beginning so the order of producing vs. registering
# the connector does not matter for the demo.
consumer.auto.offset.reset=earliest

# Where the worker looks for connector plugins (the image copies the plugin here).
plugin.path=/opt/connect-plugins

# REST API.
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
