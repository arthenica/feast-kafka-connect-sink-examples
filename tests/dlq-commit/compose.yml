# Independent of the taxi demo: every run gets a fresh project, network, and broker.
services:
  kafka:
    image: apache/kafka:4.3.0
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,DLQ://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,DLQ://test:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,DLQ:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30

  connect:
    build:
      context: ${DLQ_COMMIT_CONNECT_CONTEXT:?Run scripts/test-dlq-commit.sh}
      dockerfile: Connect.Dockerfile
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      kafka:
        condition: service_healthy

  test:
    build: .
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx256m"
    depends_on:
      connect:
        condition: service_started
