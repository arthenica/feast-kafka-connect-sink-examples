services:
  kafka:
    image: apache/kafka:4.3.0
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30

  feast:
    build: ${E2E_FEAST_CONTEXT:?Run scripts/test-json.sh, test-avro.sh, or test-protobuf.sh}
    volumes:
      - feast-data:/feature_repo/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:6566/health', timeout=3)\""]
      interval: 3s
      timeout: 5s
      retries: 40

  connect:
    build:
      context: ${E2E_CONNECT_CONTEXT:?Run an E2E script}
      dockerfile: Connect.Dockerfile
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.0
    profiles: [registry]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx384m"
    depends_on:
      kafka:
        condition: service_healthy

  test:
    build:
      context: ${E2E_TEST_CONTEXT:?Run an E2E script}
      dockerfile: Test.Dockerfile
    environment:
      E2E_SCENARIO: ${E2E_SCENARIO:?Run an E2E script}
    depends_on:
      connect:
        condition: service_started
      feast:
        condition: service_healthy

volumes:
  feast-data:
